name: mattermost-doc-alerts
on:
  issues:
    types: [opened, closed, reopened]
  # Comment events default to created + edited + deleted. Preview bots rewrite their comment on
  # every deploy, so an untyped trigger fires a run per edit -- several per pull request, none of
  # them worth a notification.
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  fork:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  mattermost-doc-alerts:
    # Filter at the job level, not the step level: a step-level condition still allocates a runner,
    # checks out, and runs the preprocess step before deciding not to post anything.
    if: github.repository_owner == 'netfoundry' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    name: POST to doc-alerts
    steps:
      - name: Strip Vercel HTML from event JSON
        id: preprocess
        run: |
          CLEANED_JSON=$(jq -c 'if .comment.body then .comment.body |= (gsub("\\s*<a\\b[^>]*vercel\\.com[^>]*>.*?</a>"; ""; "ig") | gsub("\\[vc\\]: #[^\\n]*\\n?"; "")) else . end' "$GITHUB_EVENT_PATH")
          echo "event_json<<DELIM" >> "$GITHUB_OUTPUT"
          echo "$CLEANED_JSON" >> "$GITHUB_OUTPUT"
          echo "DELIM" >> "$GITHUB_OUTPUT"
      - uses: openziti/ziti-mattermost-action-py@v1
        # The vercel[bot] carve-out this used to carry is covered by the job-level sender.type check.
        if: |
          github.event_name != 'pull_request_review'
          || github.event.review.state == 'approved'
        with:
          zitiId: ${{ secrets.ZITI_MATTERMOST_IDENTITY }}
          webhookUrl: ${{ secrets.ZHOOK_URL_DOC_NOTIFICATIONS }}
          eventJson: ${{ steps.preprocess.outputs.event_json }}
          senderUsername: "GitHubZ"
