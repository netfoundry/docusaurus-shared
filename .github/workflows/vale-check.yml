name: Lint Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Tools
        run: |
          # Install Vale. Extract outside the repo: the tarball ships its own
          # README.md/LICENSE, which otherwise clobber ours and get linted.
          tmp="$(mktemp -d)"
          wget -qO "$tmp/vale.tar.gz" https://github.com/errata-ai/vale/releases/download/v3.9.0/vale_3.9.0_Linux_64-bit.tar.gz
          tar -xzf "$tmp/vale.tar.gz" -C "$tmp" vale
          sudo mv "$tmp/vale" /usr/local/bin/
          # Install Markdownlint
          npm install -g markdownlint-cli
      - name: Run Quality Check
        run: |
          chmod +x docs-linter/lint.sh
          # Run lint.sh targeting the current directory "."
          ./docs-linter/lint.sh .
